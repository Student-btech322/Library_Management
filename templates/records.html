{% extends "base.html" %}
{% block title %}Records - {{ library_name }}{% endblock %}
{% block content %}
<div class="card">
  <div class="toolbar">
    <h1 style="margin:0">Issue records</h1>
    <div class="tabs" id="tabs">
      <button data-s="active" class="active">Issued</button>
      <button data-s="overdue">Overdue</button>
      <button data-s="returned">Returned</button>
      <button data-s="all">All</button>
    </div>
    <div class="spacer"></div>
    <input id="search" placeholder="Search student, ID card, book" style="max-width:300px">
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Student</th><th>Book</th><th>Issued</th><th>Due</th><th>Returned</th><th>Fine</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let status = 'active';
async function load() {
  const q = document.getElementById('search').value;
  const rows = await api(`/api/issues?status=${status}&q=${encodeURIComponent(q)}`);
  document.getElementById('rows').innerHTML = rows.length ? rows.map(r => `
    <tr>
      <td><strong>${esc(r.student_name)}</strong><br><span class="muted small">${esc(r.card_id)}${r.roll_no ? ' &middot; ' + esc(r.roll_no) : ''}</span></td>
      <td>${esc(r.book_title)}<br><span class="muted small">${esc(r.book_code)}</span></td>
      <td>${fmtDate(r.issue_date)}</td><td>${fmtDate(r.due_date)}</td><td>${fmtDate(r.return_date)}</td>
      <td>${r.fine ? '&#8377;' + r.fine : '-'}</td>
      <td>${statusBadge(r.status)}</td>
      <td><div class="actions">${r.status !== 'returned' ? `<button class="btn btn-sm" data-return="${r.id}">Return</button>` : ''}</div></td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty">No records</td></tr>';
}
document.getElementById('tabs').onclick = e => {
  if (!e.target.dataset.s) return;
  status = e.target.dataset.s;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b === e.target));
  load();
};
document.getElementById('search').oninput = debounce(load);
document.getElementById('rows').onclick = async e => {
  const id = e.target.dataset.return;
  if (!id) return;
  try {
    const r = await api('/api/return/' + id, { method: 'POST' });
    toast(r.fine ? `Book returned. Collect fine: \u20B9${r.fine}` : 'Book returned', 'success');
    load();
  } catch (err) { toast(err.message, 'error'); }
};
load();
</script>
{% endblock %}
