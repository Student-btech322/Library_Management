<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <title>Barcode - {{ b.title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 2rem; gap: 1rem; }
    .label { border: 1px dashed #9ca3af; padding: 4mm 6mm; text-align: center; width: 70mm; }
    .label .t { font-size: 3mm; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .label svg { width: 100%; }
    button { font: inherit; padding: .6rem 1.2rem; border-radius: 8px; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
    @media print { button { display: none; } }
  </style>
</head>
<body>
  <div class="label">
    <div class="t">{{ library_name }}</div>
    <svg id="barcode"></svg>
    <div class="t">{{ b.title }}</div>
  </div>
  <button onclick="window.print()">Print label</button>
  <script src="{{ url_for('static', filename='vendor/JsBarcode.all.min.js') }}"></script>
  <script>JsBarcode('#barcode', {{ b.code|tojson }}, { format: 'CODE128', height: 50, fontSize: 14 });</script>
</body>
</html>
